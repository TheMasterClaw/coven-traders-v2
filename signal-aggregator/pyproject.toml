[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "signal-aggregator"
version = "0.1.0"
description = "Multi-source intel pipeline for Coven Traders"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "redis>=7.4.0",
    "aiohttp>=3.13.0",
    "websockets>=16.0",
    "pydantic>=2.13.0",
    "python-dotenv>=1.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.3.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
