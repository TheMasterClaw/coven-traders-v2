game_balance:
  # Base earnings per second per unit of fleet power
  base_rate_per_power: 100

  # Sector multipliers (integer math: stored as basis points, divide by 10000)
  sectors:
    core_systems:
      name: "Core Systems"
      risk_level: 1
      yield_multiplier_bp: 5000      # 0.5x
      min_fleet_power: 0
      unlock_level: 1
    outer_rim:
      name: "Outer Rim"
      risk_level: 3
      yield_multiplier_bp: 15000     # 1.5x
      min_fleet_power: 500
      unlock_level: 5
    wormholes:
      name: "Wormholes"
      risk_level: 5
      yield_multiplier_bp: 25000     # 2.5x
      min_fleet_power: 2500
      unlock_level: 10
    black_markets:
      name: "Black Markets"
      risk_level: 7
      yield_multiplier_bp: 40000     # 4.0x
      min_fleet_power: 8000
      unlock_level: 20
    nebula:
      name: "Nebula"
      risk_level: 4
      yield_multiplier_bp: 20000     # 2.0x
      min_fleet_power: 3000
      unlock_level: 8

  # Progression
  progression:
    base_xp_for_level_2: 1000
    level_multiplier_num: 3
    level_multiplier_den: 2          # 1.5x per level
    max_level: 100
    xp_from_trade_bp: 500            # 5% of earnings as XP
    xp_from_discovery: 5000
    xp_from_battle_win: 10000
    xp_from_battle_loss: 1000
    command_center_slots_per_level: 2
    base_drone_slots: 3
    tech_points_per_level: 1

  # Boost system
  boosts:
    time_accel_2x:
      name: "Time Accelerator 2x"
      duration_seconds: 3600
      multiplier_bp: 20000           # 2.0x
      type: "time_accel"
    time_accel_4x:
      name: "Time Accelerator 4x"
      duration_seconds: 1800
      multiplier_bp: 40000           # 4.0x
      type: "time_accel"
    time_accel_8x:
      name: "Time Accelerator 8x"
      duration_seconds: 900
      multiplier_bp: 80000           # 8.0x
      type: "time_accel"
    offline_multiplier_2x:
      name: "Offline Earnings 2x"
      duration_seconds: 86400        # 24h
      multiplier_bp: 20000
      type: "offline"
    instant_complete:
      name: "Instant Completion"
      duration_seconds: 0
      multiplier_bp: 0
      type: "instant"
    max_offline_seconds: 259200      # 72 hours cap

  # Fleet / Gacha
  fleet:
    tiers:
      common:
        weight: 500
        power_range: [10, 25]
        speed_range: [5, 15]
        luck_range: [1, 5]
        defense_range: [5, 15]
        upgrade_cost_bp: 10000         # 1.0x base
        merge_bonus_bp: 5000           # 0.5x
      rare:
        weight: 300
        power_range: [25, 60]
        speed_range: [15, 35]
        luck_range: [5, 15]
        defense_range: [15, 35]
        upgrade_cost_bp: 15000
        merge_bonus_bp: 10000
      epic:
        weight: 150
        power_range: [60, 150]
        speed_range: [35, 80]
        luck_range: [15, 35]
        defense_range: [35, 80]
        upgrade_cost_bp: 25000
        merge_bonus_bp: 20000
      legendary:
        weight: 50
        power_range: [150, 400]
        speed_range: [80, 200]
        luck_range: [35, 80]
        defense_range: [80, 200]
        upgrade_cost_bp: 50000
        merge_bonus_bp: 50000
    max_fleet_size: 50
    upgrade_base_cost: 1000
    merge_same_tier_bonus_bp: 10000   # +1.0x when merging same tier

  # Tech tree
  tech_tree:
    starting_points: 0
    branches:
      navigation:
        name: "Navigation"
        unlocks_sectors: [outer_rim, wormholes]
      combat:
        name: "Combat"
        unlocks_fleet_types: ["battle_drone", "carrier"]
      economics:
        name: "Economics"
        yield_bonus_per_rank_bp: 500   # +5% per rank
      engineering:
        name: "Engineering"
        slot_bonus_per_rank: 1
    max_rank_per_tech: 10
    cost_formula_base: 2
    cost_formula_exponent: 1.5

  # Precision
  math:
    basis_points: 10000
    integer_scale: 1000000
